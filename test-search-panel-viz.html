<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель поиска с визуализатором</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: #fff;
        }
        
        /* Верхняя панель как на сайте */
        .top-actions-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: #1a1a2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
        }
        
        .nav-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            transition: all 0.2s ease;
            font-size: 18px;
        }
        
        .nav-icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Контейнер поиска */
        .search-container {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: #1a1a2e;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 999;
        }
        
        .search-bar {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .search-bar:focus-within {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }
        
        .search-icon {
            width: 20px;
            height: 20px;
            color: #888;
            flex-shrink: 0;
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            padding: 0;
        }
        
        .search-input::placeholder {
            color: #666;
        }
        
        /* Кнопка микрофона */
        .mic-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 45, 85, 0.15);
            color: #ff2d55;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .mic-button:hover {
            background: rgba(255, 45, 85, 0.25);
            transform: scale(1.05);
        }
        
        .mic-button.active {
            background: #ff2d55;
            color: #fff;
            animation: pulse-mic 2s ease-in-out infinite;
        }
        
        @keyframes pulse-mic {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255, 45, 85, 0); }
        }
        
        /* Визуализатор */
        .visualizer-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px 20px 0;
        }
        
        .visualizer-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .viz-canvas {
            width: 100%;
            height: 100px;
        }
        
        /* Статус бар */
        .status-bar {
            max-width: 800px;
            margin: 12px auto 0;
            padding: 10px 16px;
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.2);
            border-radius: 8px;
            color: #30d158;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        
        .status-bar.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Контент страницы */
        .page-content {
            margin-top: 180px;
            padding: 40px 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .placeholder-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .placeholder-line {
            height: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 12px;
        }
        
        .placeholder-line.short {
            width: 60%;
        }
        
        .placeholder-line.medium {
            width: 80%;
        }
        
        /* Selector стилей */
        .style-selector {
            max-width: 800px;
            margin: 24px auto 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .style-selector h4 {
            margin: 0 0 16px 0;
            font-size: 13px;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .style-btn {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .style-btn.selected {
            background: rgba(255, 45, 85, 0.2);
            border-color: #ff2d55;
        }
    </style>
</head>
<body>
    <!-- Верхняя панель -->
    <div class="top-actions-bar">
        <button class="nav-icon-btn" title="Войти">👤</button>
        <button class="nav-icon-btn" title="Статистика">📊</button>
        <button class="nav-icon-btn" title="Начать обучение">🎯</button>
    </div>
    
    <!-- Панель поиска -->
    <div class="search-container">
        <div class="search-bar">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" class="search-input" placeholder="Введите запрос или нажмите на микрофон...">
            <button class="mic-button" id="micBtn" title="Включить микрофон">🎤</button>
        </div>
        
        <!-- Визуализатор -->
        <div class="visualizer-container">
            <div class="visualizer-wrapper">
                <canvas class="viz-canvas" id="viz-apple"></canvas>
            </div>
        </div>
        
        <!-- Статус -->
        <div class="status-bar" id="statusBar">
            ✅ Микрофон активен | Говорите...
        </div>
        
        <!-- Выбор стиля -->
        <div class="style-selector">
            <h4>Стиль визуализатора</h4>
            <div class="style-grid">
                <button class="style-btn selected" data-style="apple">Apple</button>
                <button class="style-btn" data-style="gradient">Градиент</button>
                <button class="style-btn" data-style="neon">Неон</button>
                <button class="style-btn" data-style="minimal">Минимал</button>
                <button class="style-btn" data-style="bars">Столбики</button>
            </div>
        </div>
    </div>
    
    <!-- Контент страницы -->
    <div class="page-content">
        <div class="placeholder-card">
            <div class="placeholder-line"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line short"></div>
        </div>
        
        <div class="placeholder-card">
            <div class="placeholder-line"></div>
            <div class="placeholder-line medium"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line short"></div>
        </div>
        
        <div class="placeholder-card">
            <div class="placeholder-line medium"></div>
            <div class="placeholder-line"></div>
            <div class="placeholder-line"></div>
        </div>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let frequencyData = null;
        let isRecording = false;
        let animationId = null;
        let selectedStyle = 'apple';

        const styles = {
            apple: { bars: 16, color: '#ff2d55', gradient: ['#ff2d55', '#ff6b7a'], rounded: true, height: 0.85 },
            gradient: { bars: 24, colors: ['#ff2d55', '#ff9f0a', '#30d158', '#0a84ff'], rounded: true, height: 0.9 },
            neon: { bars: 20, color: '#0a84ff', glow: true, rounded: false, height: 0.85 },
            minimal: { bars: 12, color: '#ffffff', rounded: true, height: 0.75 },
            bars: { bars: 32, color: '#30d158', rounded: false, height: 0.95 }
        };

        function initCanvas() {
            const canvas = document.getElementById('viz-apple');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth * 2;
            canvas.height = canvas.clientHeight * 2;
            ctx.scale(2, 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,
                        noiseSuppression: false,
                        autoGainControl: true
                    } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.65;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                frequencyData = new Uint8Array(bufferLength);
                
                isRecording = true;
                drawVisualizer();
                
                document.getElementById('micBtn').classList.add('active');
                document.getElementById('statusBar').classList.add('visible');
            } catch (err) {
                console.error('Ошибка:', err);
                alert('Не удалось получить доступ к микрофону');
            }
        }

        function stopRecording() {
            isRecording = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (microphone) microphone.disconnect();
            if (audioContext) audioContext.close();
            audioContext = null;
            analyser = null;
            microphone = null;
            frequencyData = null;
            initCanvas();
            document.getElementById('micBtn').classList.remove('active');
            document.getElementById('statusBar').classList.remove('visible');
        }

        function drawVisualizer() {
            if (!analyser) return;
            analyser.getByteFrequencyData(frequencyData);
            const config = styles[selectedStyle];
            drawBars(config);
            if (isRecording) {
                animationId = requestAnimationFrame(drawVisualizer);
            }
        }

        function drawBars(config) {
            const canvas = document.getElementById('viz-apple');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width / 2;
            const height = canvas.height / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            const barCount = config.bars;
            const barWidth = (width / barCount) - 4;
            const step = Math.floor(frequencyData.length / barCount);
            const time = Date.now() * 0.002;

            for (let i = 0; i < barCount; i++) {
                let value = frequencyData[i * step];
                const frequencyMultiplier = 1 + (i / barCount) * 1.5;
                value = Math.min(255, value * frequencyMultiplier);
                
                let barHeight;
                if (value < 30) {
                    const wave = Math.sin(time + i * 0.4) * 0.5 + 0.5;
                    const wave2 = Math.sin(time * 1.3 + i * 0.2) * 0.3 + 0.3;
                    barHeight = (wave + wave2) * height * 0.08;
                } else {
                    barHeight = (value / 255) * height * config.height;
                }
                
                const x = i * (barWidth + 4) + 2;
                const y = height - barHeight;

                if (config.colors) {
                    const gradient = ctx.createLinearGradient(x, y, x, height);
                    const colorIndex = Math.floor((i / barCount) * config.colors.length);
                    gradient.addColorStop(0, config.colors[colorIndex]);
                    gradient.addColorStop(1, config.colors[Math.min(colorIndex + 1, config.colors.length - 1)]);
                    ctx.fillStyle = gradient;
                } else {
                    ctx.fillStyle = config.color;
                }
                
                if (config.rounded) {
                    ctx.beginPath();
                    ctx.roundRect(x, y, barWidth, barHeight, [6, 6, 0, 0]);
                    ctx.fill();
                } else {
                    ctx.fillRect(x, y, barWidth, barHeight);
                }

                if (config.glow) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = config.color;
                }
            }
            ctx.shadowBlur = 0;
        }

        // Обработчик микрофона
        document.getElementById('micBtn').addEventListener('click', function() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        // Обработчики стилей
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                selectedStyle = this.dataset.style;
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        window.addEventListener('load', initCanvas);
    </script>
</body>
</html>
