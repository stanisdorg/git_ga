<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Music Style Visualizer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #0d0d1a 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }
        
        p.subtitle {
            color: #86868b;
            font-size: 15px;
            margin: 0 0 40px 0;
            font-weight: 400;
        }
        
        .player-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        
        .album-art {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #ff2d55, #ff6b7a, #ff9f9f);
            border-radius: 12px;
            margin: 0 auto 32px;
            box-shadow: 0 10px 40px rgba(255, 45, 85, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
        }
        
        .track-info {
            margin-bottom: 32px;
        }
        
        .track-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: #fff;
        }
        
        .track-artist {
            font-size: 15px;
            color: #86868b;
            font-weight: 500;
        }
        
        .mic-button {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255, 45, 85, 0.15);
            border: 2px solid rgba(255, 45, 85, 0.3);
            border-radius: 14px;
            color: #ff2d55;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        
        .mic-button:hover {
            background: rgba(255, 45, 85, 0.25);
            border-color: rgba(255, 45, 85, 0.5);
            transform: scale(1.02);
        }
        
        .mic-button.active {
            background: #ff2d55;
            border-color: #ff2d55;
            color: #fff;
            animation: pulse-mic 2s ease-in-out infinite;
        }
        
        @keyframes pulse-mic {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 45, 85, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(255, 45, 85, 0); }
        }
        
        .mic-icon {
            font-size: 20px;
        }
        
        .visualizer-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        
        .viz-canvas {
            width: 100%;
            height: 120px;
        }
        
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        
        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 20px;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .control-btn.play {
            background: #ff2d55;
            width: 64px;
            height: 64px;
        }
        
        .control-btn.play:hover {
            background: #ff4066;
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #ff2d55;
            border-radius: 2px;
            width: 35%;
            transition: width 0.3s ease;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #86868b;
            font-weight: 500;
        }
        
        .style-selector {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .style-selector h3 {
            font-size: 14px;
            font-weight: 600;
            color: #86868b;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .style-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        
        .style-btn {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .style-btn.selected {
            background: rgba(255, 45, 85, 0.2);
            border-color: #ff2d55;
        }
        
        #selectedInfo {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 24px;
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            max-width: 500px;
            backdrop-filter: blur(20px);
        }
        
        #selectedInfo.show {
            display: block;
        }
        
        #selectedInfo h3 {
            margin: 0 0 16px 0;
            font-size: 14px;
            color: #fff;
            font-weight: 600;
        }
        
        #selectedInfo code {
            display: block;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 11px;
            color: #a1a1a6;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        
        #selectedInfo .copy-btn {
            margin-top: 16px;
            padding: 12px 24px;
            background: #ff2d55;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        
        #selectedInfo .copy-btn:hover {
            background: #ff4066;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Apple Music Visualizer</h1>
        <p class="subtitle">Минималистичный эквалайзер в стиле Apple</p>
        
        <div class="player-card">
            <div class="album-art">🎵</div>
            
            <div class="track-info">
                <div class="track-title">Название трека</div>
                <div class="track-artist">Исполнитель</div>
            </div>
            
            <button id="micBtn" class="mic-button">
                <span class="mic-icon">🎤</span>
                <span class="mic-text">Включить микрофон</span>
            </button>
            
            <div class="visualizer-wrapper">
                <canvas class="viz-canvas" id="viz-apple"></canvas>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="time-display">
                <span>1:24</span>
                <span>4:03</span>
            </div>
            
            <div class="controls" style="margin-top: 24px;">
                <button class="control-btn">⏮</button>
                <button class="control-btn play">▶</button>
                <button class="control-btn">⏭</button>
            </div>
        </div>
        
        <div class="status-bar" id="statusBar" style="display: none; margin-top: 20px; padding: 12px 20px; background: rgba(48, 209, 88, 0.15); border: 1px solid rgba(48, 209, 88, 0.3); border-radius: 12px; color: #30d158; font-size: 13px; font-weight: 500; text-align: center;">
            ✅ Микрофон активен | Говорите...
        </div>
        
        <div class="style-selector">
            <h3>Стиль визуализатора</h3>
            <div class="style-grid">
                <button class="style-btn selected" data-style="apple">Apple Music</button>
                <button class="style-btn" data-style="gradient">Градиент</button>
                <button class="style-btn" data-style="neon">Неон</button>
                <button class="style-btn" data-style="minimal">Минимал</button>
                <button class="style-btn" data-style="bars">Столбики</button>
                <button class="style-btn" data-style="wave">Волна</button>
            </div>
        </div>
    </div>
    
    <div id="selectedInfo">
        <h3>✅ Код визуализатора:</h3>
        <code id="selectedVariant"></code>
        <button class="copy-btn" onclick="copySelectedCode()">📋 Скопировать</button>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let frequencyData = null;
        let isRecording = false;
        let animationId = null;
        let selectedStyle = 'apple';

        const styles = {
            apple: { bars: 16, color: '#ff2d55', gradient: ['#ff2d55', '#ff6b7a'], rounded: true, height: 0.85 },
            gradient: { bars: 24, colors: ['#ff2d55', '#ff9f0a', '#30d158', '#0a84ff'], rounded: true, height: 0.9 },
            neon: { bars: 20, color: '#0a84ff', glow: true, rounded: false, height: 0.85 },
            minimal: { bars: 12, color: '#ffffff', rounded: true, height: 0.75 },
            bars: { bars: 32, color: '#30d158', rounded: false, height: 0.95 },
            wave: { type: 'wave', color: '#ff2d55', lineWidth: 3 }
        };

        function initCanvas() {
            const canvas = document.getElementById('viz-apple');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.clientWidth * 2;
            canvas.height = canvas.clientHeight * 2;
            ctx.scale(2, 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,
                        noiseSuppression: false,
                        autoGainControl: true
                    } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.65;
                
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                frequencyData = new Uint8Array(bufferLength);
                
                isRecording = true;
                drawVisualizer();
                
                micBtn.classList.add('active');
                micBtn.innerHTML = '<span class="mic-icon">🎤</span><span class="mic-text">Микрофон включён...</span>';
                statusBar.style.display = 'block';
            } catch (err) {
                console.error('Ошибка:', err);
                alert('Не удалось получить доступ к микрофону');
            }
        }

        function stopRecording() {
            isRecording = false;
            if (animationId) cancelAnimationFrame(animationId);
            if (microphone) microphone.disconnect();
            if (audioContext) audioContext.close();
            audioContext = null;
            analyser = null;
            microphone = null;
            frequencyData = null;
            initCanvas();
        }

        function drawVisualizer() {
            if (!analyser) return;

            analyser.getByteFrequencyData(frequencyData);
            
            const config = styles[selectedStyle];
            
            if (config.type === 'wave') {
                drawWave(config);
            } else {
                drawBars(config);
            }

            if (isRecording) {
                animationId = requestAnimationFrame(drawVisualizer);
            }
        }

        function drawBars(config) {
            const canvas = document.getElementById('viz-apple');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width / 2;
            const height = canvas.height / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            const barCount = config.bars;
            const barWidth = (width / barCount) - 4;
            const step = Math.floor(frequencyData.length / barCount);

            // Время для фоновой анимации
            const time = Date.now() * 0.002;

            for (let i = 0; i < barCount; i++) {
                let value = frequencyData[i * step];
                
                // Усиливаем сигнал для высоких частот (чтобы все столбики работали)
                const frequencyMultiplier = 1 + (i / barCount) * 1.5;
                value = Math.min(255, value * frequencyMultiplier);
                
                // Фоновая анимация в тишине (когда value < 30)
                let barHeight;
                if (value < 30) {
                    // Плавная волна снизу
                    const wave = Math.sin(time + i * 0.4) * 0.5 + 0.5;
                    const wave2 = Math.sin(time * 1.3 + i * 0.2) * 0.3 + 0.3;
                    barHeight = (wave + wave2) * height * 0.08; // 8% высоты в тишине
                } else {
                    barHeight = (value / 255) * height * config.height;
                }
                
                const x = i * (barWidth + 4) + 2;
                const y = height - barHeight;

                if (config.colors) {
                    const gradient = ctx.createLinearGradient(x, y, x, height);
                    const colorIndex = Math.floor((i / barCount) * config.colors.length);
                    gradient.addColorStop(0, config.colors[colorIndex]);
                    gradient.addColorStop(1, config.colors[Math.min(colorIndex + 1, config.colors.length - 1)]);
                    ctx.fillStyle = gradient;
                } else {
                    ctx.fillStyle = config.color;
                }
                
                if (config.rounded) {
                    ctx.beginPath();
                    ctx.roundRect(x, y, barWidth, barHeight, [6, 6, 0, 0]);
                    ctx.fill();
                } else {
                    ctx.fillRect(x, y, barWidth, barHeight);
                }

                if (config.glow) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = config.color;
                }
            }
            ctx.shadowBlur = 0;
        }

        function drawWave(config) {
            const canvas = document.getElementById('viz-apple');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width / 2;
            const height = canvas.height / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            ctx.lineWidth = config.lineWidth;
            ctx.strokeStyle = config.color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            const sliceWidth = width * 1.0 / frequencyData.length;
            let x = 0;

            for (let i = 0; i < frequencyData.length; i++) {
                const v = (frequencyData[i] - 128) / 128.0;
                const y = (height / 2) + v * (height / 2) * 4;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);

                x += sliceWidth;
            }

            ctx.stroke();
        }

        // Обработчик кнопки микрофона
        const micBtn = document.getElementById('micBtn');
        const statusBar = document.getElementById('statusBar');
        
        micBtn.addEventListener('click', function() {
            if (isRecording) {
                stopRecording();
                micBtn.classList.remove('active');
                micBtn.innerHTML = '<span class="mic-icon">🎤</span><span class="mic-text">Включить микрофон</span>';
                statusBar.style.display = 'none';
            } else {
                startRecording();
                micBtn.classList.add('active');
                micBtn.innerHTML = '<span class="mic-icon">🎤</span><span class="mic-text">Микрофон включён...</span>';
                statusBar.style.display = 'block';
            }
        });

        // Обработчики кнопок
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                selectedStyle = this.dataset.style;
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                
                const code = getCodeForStyle(selectedStyle);
                document.getElementById('selectedInfo').classList.add('show');
                document.getElementById('selectedVariant').textContent = code;
            });
        });

        function getCodeForStyle(style) {
            const codes = {
                apple: `// Apple Music Style
function drawAppleVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 16;
        const barWidth = (width / barCount) - 4;
        const step = Math.floor(frequencyData.length / barCount);
        
        for (let i = 0; i < barCount; i++) {
            const value = frequencyData[i * step];
            const barHeight = (value / 255) * height * 0.85;
            
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#ff2d55');
            gradient.addColorStop(1, '#ff6b7a');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(i * (barWidth + 4) + 2, height - barHeight, barWidth, barHeight, [6, 6, 0, 0]);
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
}`,
                gradient: `// Градиент
function drawGradientVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 24;
        const barWidth = (width / barCount) - 4;
        const step = Math.floor(frequencyData.length / barCount);
        const colors = ['#ff2d55', '#ff9f0a', '#30d158', '#0a84ff'];
        
        for (let i = 0; i < barCount; i++) {
            const value = frequencyData[i * step];
            const barHeight = (value / 255) * height * 0.9;
            const colorIndex = Math.floor((i / barCount) * colors.length);
            
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, colors[colorIndex]);
            gradient.addColorStop(1, colors[Math.min(colorIndex + 1, colors.length - 1)]);
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(i * (barWidth + 4) + 2, height - barHeight, barWidth, barHeight, [6, 6, 0, 0]);
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
}`,
                neon: `// Неон
function drawNeonVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 20;
        const barWidth = (width / barCount) - 4;
        const step = Math.floor(frequencyData.length / barCount);
        
        for (let i = 0; i < barCount; i++) {
            const value = frequencyData[i * step];
            const barHeight = (value / 255) * height * 0.85;
            
            ctx.fillStyle = '#0a84ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0a84ff';
            ctx.fillRect(i * (barWidth + 4) + 2, height - barHeight, barWidth, barHeight);
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
    }
    draw();
}`,
                minimal: `// Минимал
function drawMinimalVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 12;
        const barWidth = (width / barCount) - 4;
        const step = Math.floor(frequencyData.length / barCount);
        
        for (let i = 0; i < barCount; i++) {
            const value = frequencyData[i * step];
            const barHeight = (value / 255) * height * 0.75;
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(i * (barWidth + 4) + 2, height - barHeight, barWidth, barHeight, [6, 6, 0, 0]);
            ctx.fill();
        }
        requestAnimationFrame(draw);
    }
    draw();
}`,
                bars: `// Столбики
function drawBarsVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        const barCount = 32;
        const barWidth = (width / barCount) - 4;
        const step = Math.floor(frequencyData.length / barCount);
        
        for (let i = 0; i < barCount; i++) {
            const value = frequencyData[i * step];
            const barHeight = (value / 255) * height * 0.95;
            
            ctx.fillStyle = '#30d158';
            ctx.fillRect(i * (barWidth + 4) + 2, height - barHeight, barWidth, barHeight);
        }
        requestAnimationFrame(draw);
    }
    draw();
}`,
                wave: `// Волна
function drawWaveVisualizer(analyser, canvasEl) {
    const ctx = canvasEl.getContext('2d');
    const width = canvasEl.width;
    const height = canvasEl.height;
    const frequencyData = new Uint8Array(analyser.frequencyBinCount);
    
    function draw() {
        analyser.getByteFrequencyData(frequencyData);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, width, height);
        
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ff2d55';
        ctx.lineCap = 'round';
        ctx.beginPath();
        
        const sliceWidth = width * 1.0 / frequencyData.length;
        let x = 0;
        
        for (let i = 0; i < frequencyData.length; i++) {
            const v = (frequencyData[i] - 128) / 128.0;
            const y = (height / 2) + v * (height / 2) * 4;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
            x += sliceWidth;
        }
        ctx.stroke();
        requestAnimationFrame(draw);
    }
    draw();
}`
            };
            return codes[style] || '';
        }

        function copySelectedCode() {
            const code = getCodeForStyle(selectedStyle);
            navigator.clipboard.writeText(code).then(() => {
                alert('Код скопирован!');
            }).catch(() => alert('Ошибка копирования'));
        }

        window.addEventListener('load', initCanvas);
    </script>
</body>
