<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 Вариантов Глассморфизм</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --card-bg: #1a1a2e;
            --text: #ffffff;
            --text-muted: #8888aa;
            
            /* Цвета кнопок */
            --again-color: #ff4757;
            --again-light: rgba(255, 71, 87, 0.3);
            --hard-color: #ffa502;
            --hard-light: rgba(255, 165, 2, 0.3);
            --good-color: #2ed573;
            --good-light: rgba(46, 213, 115, 0.3);
            --easy-color: #1e90ff;
            --easy-light: rgba(30, 144, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: var(--text);
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            background: linear-gradient(90deg, #ff4757, #ffa502, #2ed573, #1e90ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.info {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .variants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .variant-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .variant-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .flashcard-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        /* ==================== GLASSMORPHISM VARIANTS ==================== */
        
        /* Вариант 1: Классический глассморфизм */
        .variant-1 .rate-btn {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .variant-1 .rate-again { background: var(--again-light); color: #ff6b7a; }
        .variant-1 .rate-hard { background: var(--hard-light); color: #ffc048; }
        .variant-1 .rate-good { background: var(--good-light); color: #7bed9f; }
        .variant-1 .rate-easy { background: var(--easy-light); color: #70a1ff; }
        .variant-1 .rate-btn:hover {
            background: currentColor;
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px currentColor;
        }

        .variant-2 .rate-btn:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
