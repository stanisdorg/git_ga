<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализаторы в строке поиска - Активные</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(135deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }

        .search-bar-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-bar-container h3 {
            margin: 0 0 15px 0;
            font-size: 1.1em;
            color: #ccc;
        }

        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 12px 16px;
            gap: 12px;
        }

        .search-icon {
            width: 20px;
            height: 20px;
            color: #888;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            padding: 0;
        }

        .search-input::placeholder {
            color: #666;
        }

        .visualizer-container {
            width: 120px;
            height: 40px;
            position: relative;
            flex-shrink: 0;
        }

        .select-btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            white-space: nowrap;
            margin-top: 10px;
        }

        .select-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .select-btn.selected {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        /* ============================================
           CURRENT: Site Version (с градиентом прозрачности)
           ============================================ */
        .viz-current {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            gap: 3px;
            mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
        }

        .viz-current .bar {
            width: 6px;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-radius: 3px;
            box-shadow: 
                inset 0 0 8px rgba(255, 255, 255, 0.2),
                0 0 6px rgba(255, 255, 255, 0.15);
            animation: current-anim 0.8s ease-in-out infinite;
        }

        .viz-current .bar:nth-child(1) { animation-delay: 0s; height: 30%; }
        .viz-current .bar:nth-child(2) { animation-delay: 0.1s; height: 50%; }
        .viz-current .bar:nth-child(3) { animation-delay: 0.2s; height: 70%; }
        .viz-current .bar:nth-child(4) { animation-delay: 0.3s; height: 90%; }
        .viz-current .bar:nth-child(5) { animation-delay: 0.4s; height: 100%; }
        .viz-current .bar:nth-child(6) { animation-delay: 0.5s; height: 80%; }
        .viz-current .bar:nth-child(7) { animation-delay: 0.6s; height: 60%; }
        .viz-current .bar:nth-child(8) { animation-delay: 0.7s; height: 40%; }
        .viz-current .bar:nth-child(9) { animation-delay: 0.8s; height: 50%; }
        .viz-current .bar:nth-child(10) { animation-delay: 0.9s; height: 70%; }
        .viz-current .bar:nth-child(11) { animation-delay: 1s; height: 85%; }
        .viz-current .bar:nth-child(12) { animation-delay: 1.1s; height: 95%; }
        .viz-current .bar:nth-child(13) { animation-delay: 1.2s; height: 75%; }
        .viz-current .bar:nth-child(14) { animation-delay: 1.3s; height: 55%; }
        .viz-current .bar:nth-child(15) { animation-delay: 1.4s; height: 35%; }
        .viz-current .bar:nth-child(16) { animation-delay: 1.5s; height: 45%; }
        .viz-current .bar:nth-child(17) { animation-delay: 1.6s; height: 65%; }
        .viz-current .bar:nth-child(18) { animation-delay: 1.7s; height: 80%; }
        .viz-current .bar:nth-child(19) { animation-delay: 1.8s; height: 60%; }
        .viz-current .bar:nth-child(20) { animation-delay: 1.9s; height: 40%; }

        @keyframes current-anim {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        /* ============================================
           VARIANT 1: Classic Bars
           ============================================ */
        .viz-classic-bars {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            gap: 3px;
            mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
        }

        .viz-classic-bars .bar {
            width: 6px;
            background: linear-gradient(to top, #00d9ff, #00ff88);
            border-radius: 3px;
            animation: classic-bars-anim 0.8s ease-in-out infinite;
        }

        .viz-classic-bars .bar:nth-child(1) { animation-delay: 0s; height: 40%; }
        .viz-classic-bars .bar:nth-child(2) { animation-delay: 0.1s; height: 70%; }
        .viz-classic-bars .bar:nth-child(3) { animation-delay: 0.2s; height: 100%; }
        .viz-classic-bars .bar:nth-child(4) { animation-delay: 0.3s; height: 60%; }
        .viz-classic-bars .bar:nth-child(5) { animation-delay: 0.4s; height: 80%; }
        .viz-classic-bars .bar:nth-child(6) { animation-delay: 0.5s; height: 50%; }
        .viz-classic-bars .bar:nth-child(7) { animation-delay: 0.6s; height: 90%; }
        .viz-classic-bars .bar:nth-child(8) { animation-delay: 0.7s; height: 65%; }
        .viz-classic-bars .bar:nth-child(9) { animation-delay: 0.8s; height: 75%; }
        .viz-classic-bars .bar:nth-child(10) { animation-delay: 0.9s; height: 55%; }
        .viz-classic-bars .bar:nth-child(11) { animation-delay: 1s; height: 85%; }
        .viz-classic-bars .bar:nth-child(12) { animation-delay: 1.1s; height: 95%; }
        .viz-classic-bars .bar:nth-child(13) { animation-delay: 1.2s; height: 70%; }
        .viz-classic-bars .bar:nth-child(14) { animation-delay: 1.3s; height: 45%; }
        .viz-classic-bars .bar:nth-child(15) { animation-delay: 1.4s; height: 60%; }
        .viz-classic-bars .bar:nth-child(16) { animation-delay: 1.5s; height: 80%; }
        .viz-classic-bars .bar:nth-child(17) { animation-delay: 1.6s; height: 50%; }
        .viz-classic-bars .bar:nth-child(18) { animation-delay: 1.7s; height: 75%; }
        .viz-classic-bars .bar:nth-child(19) { animation-delay: 1.8s; height: 65%; }
        .viz-classic-bars .bar:nth-child(20) { animation-delay: 1.9s; height: 40%; }

        @keyframes classic-bars-anim {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }

        /* ============================================
           VARIANT 4: Neon Glow
           ============================================ */
        .viz-neon-glow {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            gap: 4px;
            mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
        }

        .viz-neon-glow .bar {
            width: 8px;
            background: linear-gradient(to top, #ff00ff, #ff66ff);
            border-radius: 4px;
            box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            animation: neon-glow-anim 0.6s ease-in-out infinite;
        }

        .viz-neon-glow .bar:nth-child(1) { animation-delay: 0s; height: 50%; }
        .viz-neon-glow .bar:nth-child(2) { animation-delay: 0.15s; height: 80%; }
        .viz-neon-glow .bar:nth-child(3) { animation-delay: 0.3s; height: 100%; }
        .viz-neon-glow .bar:nth-child(4) { animation-delay: 0.45s; height: 70%; }
        .viz-neon-glow .bar:nth-child(5) { animation-delay: 0.6s; height: 60%; }
        .viz-neon-glow .bar:nth-child(6) { animation-delay: 0.75s; height: 90%; }
        .viz-neon-glow .bar:nth-child(7) { animation-delay: 0.9s; height: 75%; }
        .viz-neon-glow .bar:nth-child(8) { animation-delay: 1.05s; height: 55%; }
        .viz-neon-glow .bar:nth-child(9) { animation-delay: 1.2s; height: 85%; }
        .viz-neon-glow .bar:nth-child(10) { animation-delay: 1.35s; height: 65%; }
        .viz-neon-glow .bar:nth-child(11) { animation-delay: 1.5s; height: 95%; }
        .viz-neon-glow .bar:nth-child(12) { animation-delay: 1.65s; height: 70%; }
        .viz-neon-glow .bar:nth-child(13) { animation-delay: 1.8s; height: 50%; }
        .viz-neon-glow .bar:nth-child(14) { animation-delay: 1.95s; height: 80%; }
        .viz-neon-glow .bar:nth-child(15) { animation-delay: 2.1s; height: 60%; }
        .viz-neon-glow .bar:nth-child(16) { animation-delay: 2.25s; height: 75%; }

        @keyframes neon-glow-anim {
            0%, 100% { 
                transform: scaleY(0.4);
                box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            }
            50% { 
                transform: scaleY(1);
                box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff;
            }
        }

        /* ============================================
           VARIANT 9: Sound Wave
           ============================================ */
        .viz-sound-wave {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 100%;
            gap: 5px;
            mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20%, black 100%);
        }

        .viz-sound-wave .wave {
            width: 5px;
            height: 20px;
            background: linear-gradient(to right, #00d9ff, #a855f7);
            border-radius: 3px;
            animation: sound-wave-anim 1s ease-in-out infinite;
        }

        .viz-sound-wave .wave:nth-child(1) { animation-delay: 0s; }
        .viz-sound-wave .wave:nth-child(2) { animation-delay: 0.08s; }
        .viz-sound-wave .wave:nth-child(3) { animation-delay: 0.16s; }
        .viz-sound-wave .wave:nth-child(4) { animation-delay: 0.24s; }
        .viz-sound-wave .wave:nth-child(5) { animation-delay: 0.32s; }
        .viz-sound-wave .wave:nth-child(6) { animation-delay: 0.4s; }
        .viz-sound-wave .wave:nth-child(7) { animation-delay: 0.48s; }
        .viz-sound-wave .wave:nth-child(8) { animation-delay: 0.56s; }
        .viz-sound-wave .wave:nth-child(9) { animation-delay: 0.64s; }
        .viz-sound-wave .wave:nth-child(10) { animation-delay: 0.72s; }
        .viz-sound-wave .wave:nth-child(11) { animation-delay: 0.8s; }
        .viz-sound-wave .wave:nth-child(12) { animation-delay: 0.88s; }
        .viz-sound-wave .wave:nth-child(13) { animation-delay: 0.96s; }
        .viz-sound-wave .wave:nth-child(14) { animation-delay: 1.04s; }
        .viz-sound-wave .wave:nth-child(15) { animation-delay: 1.12s; }
        .viz-sound-wave .wave:nth-child(16) { animation-delay: 1.2s; }
        .viz-sound-wave .wave:nth-child(17) { animation-delay: 1.28s; }
        .viz-sound-wave .wave:nth-child(18) { animation-delay: 1.36s; }
        .viz-sound-wave .wave:nth-child(19) { animation-delay: 1.44s; }
        .viz-sound-wave .wave:nth-child(20) { animation-delay: 1.52s; }

        @keyframes sound-wave-anim {
            0%, 100% { height: 10px; opacity: 0.5; }
            50% { height: 30px; opacity: 1; }
        }

        /* Selected info */
        #selectedInfo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 255, 136, 0.5);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            z-index: 1000;
            display: none;
        }

        #selectedInfo.show {
            display: block;
        }

        #selectedInfo h3 {
            margin: 0 0 10px 0;
            font-size: 1em;
            color: #00ff88;
        }

        #selectedInfo code {
            display: block;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
            color: #00ff88;
            max-height: 300px;
            overflow-y: auto;
        }

        #selectedInfo .copy-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #selectedInfo .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        }

        .current-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid rgba(255, 100, 100, 0.5);
            border-radius: 4px;
            font-size: 0.75em;
            color: #ff6666;
            margin-left: 8px;
        }
    </style>
</head>

        document.querySelectorAll('.select-btn').forEach(btn => {

                document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('selected'));

        function copySelectedCSS() {
            if (!selectedVariant) {
                alert('Сначала выберите вариант!');
                return;
            }

            const css = cssVariants[selectedVariant] || `/* CSS for ${selectedVariant} */`;
            navigator.clipboard.writeText(css).then(() => {
                alert(`CSS для "${selectedVariant}" скопирован!`);
            }).catch(err => {
                console.error('Ошибка:', err);
                alert('Ошибка копирования');
            });
