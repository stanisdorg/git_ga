<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест вариантов toolbar</title>
    <style>
        :root {
            --color-bg: #1e1e1e;
            --color-bg-secondary: #2a2a2a;
            --color-bg-tertiary: #333333;
            --color-border: #3a3a3a;
            --color-text: #ffffff;
            --color-text-secondary: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: var(--color-text);
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .test-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .test-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 15px;
        }

        .test-card h3 {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }

        .test-card .preview {
            min-height: 80px;
            background: var(--color-bg-secondary);
            border-radius: 4px;
            padding: 10px;
        }

        /* Цвета */
        .colors {
            #F5B042, #FF8C42, #4ECDC4, #B794F4, #FF9F7C, #7FCDCD, #FF6B6B
        }

        /* ========== ВАРИАНТ 1: Две строки (Desktop) ========== */
        .v1-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v1-section {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .v1-divider {
            width: 1px;
            height: 24px;
            background: var(--color-border);
            margin: 0 4px;
        }

        .v1-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .v1-color-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .v1-label {
            font-size: 10px;
            color: var(--color-text-secondary);
            margin-right: 4px;
        }

        /* ========== ВАРИАНТ 2: Компактные иконки ========== */
        .v2-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v2-btn {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .v2-color-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            cursor: pointer;
        }

        /* ========== ВАРИАНТ 3: Выпадающие меню ========== */
        .v3-toolbar {
            display: flex;
            gap: 4px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
            flex-wrap: wrap;
        }

        .v3-btn {
            padding: 4px 8px;
            border-radius: 3px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 11px;
            position: relative;
        }

        .v3-colors {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            z-index: 100;
        }

        .v3-btn:hover .v3-colors {
            display: grid;
        }

        /* ========== ВАРИАНТ 4: Горизонтальный скролл ========== */
        .v4-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) var(--color-bg-secondary);
        }

        .v4-toolbar::-webkit-scrollbar {
            height: 4px;
        }

        .v4-toolbar::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 2px;
        }

        .v4-section {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }

        /* ========== ВАРИАНТ 5: Две панели ========== */
        .v5-toolbar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v5-row {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ========== ВАРИАНТ 6: Круглые кнопки ========== */
        .v6-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v6-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 10px;
        }

        .v6-color-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--color-border);
            cursor: pointer;
        }

        /* ========== ВАРИАНТ 7: Минимализм ========== */
        .v7-toolbar {
            display: flex;
            gap: 2px;
            padding: 4px;
            background: var(--color-bg-secondary);
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .v7-btn {
            width: 20px;
            height: 20px;
            border: none;
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .v7-btn:hover {
            background: var(--color-border);
            border-radius: 2px;
        }

        .v7-color-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            cursor: pointer;
        }

        /* ========== ВАРИАНТ 8: Аккордеон ========== */
        .v8-toolbar {
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v8-header {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .v8-btn {
            padding: 4px 8px;
            border-radius: 3px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 11px;
        }

        .v8-content {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            padding-top: 4px;
            border-top: 1px solid var(--color-border);
        }

        /* ========== ВАРИАНТ 9: Сетка ========== */
        .v9-toolbar {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v9-btn {
            aspect-ratio: 1;
            border-radius: 3px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .v9-color-btn {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid var(--color-border);
            cursor: pointer;
        }

        /* ========== ВАРИАНТ 10: Вкладки ========== */
        .v10-toolbar {
            padding: 6px;
            background: var(--color-bg-secondary);
            border-radius: 6px;
        }

        .v10-tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 4px;
        }

        .v10-tab {
            padding: 4px 8px;
            border-radius: 3px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: 11px;
        }

        .v10-tab.active {
            background: var(--color-bg);
            border-color: var(--color-border);
            color: var(--color-text);
        }

        .v10-content {
            display: none;
            gap: 4px;
            flex-wrap: wrap;
        }

        .v10-content.active {
            display: flex;
        }

        .v10-btn {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            cursor: pointer;
            font-size: 11px;
        }

        .v10-color-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--color-border);
            cursor: pointer;
        }

        /* Мобильная версия */
        @media (max-width: 400px) {
            .test-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                        <button class="v10-color-btn" style="background: rgba(78, 205, 196, 0.2)"></button>
                        <button class="v10-color-btn" style="background: rgba(183, 148, 244, 0.2)"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabNum) {
            // Убираем active у всех tabs
            document.querySelectorAll('.v10-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            // Добавляем active выбранному tab
            event.target.classList.add('active');
            
            // Скрываем все content
            document.querySelectorAll('.v10-content').forEach(content => {
                content.classList.remove('active');
            });
            // Показываем выбранный content
            document.getElementById('v10-content-' + tabNum).classList.add('active');
        }
    </script>
</body>
</html>
