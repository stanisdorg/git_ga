<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовой помощник QA</title>
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="stylesheet" href="style.css?v=2.00">
    <link rel="stylesheet" href="custom-styles.css?v=60.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.svg">
    <style>
        /* Встроенные стили для гарантированного применения */
        span.category-badge, 
        span.subcategory-badge, 
        span.result-category, 
        span.result-subcategory,
        .category-badge,
        .subcategory-badge,
        .result-category,
        .result-subcategory {
            display: inline-block !important;
            padding: 1px 4px !important;
            border-radius: 5px !important;
            font-size: 9px !important;
            margin-right: 4px !important;
            opacity: 0.4 !important;
            background-color: #000000 !important;
            color: #ffffff !important;
            border: 1px solid #333333 !important;
        }
        
        /* Стили кнопки микрофона перенесены в custom-styles.css */
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar collapsed">
            <div class="sidebar-header">
                <h2 class="sidebar-title"></h2>
                <div class="sidebar-mode-buttons" aria-label="Режимы">
                    <button id="history-button" class="nav-icon-btn" title="История" aria-label="История">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
                            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button id="transcription-button" class="nav-icon-btn" title="Transcription" aria-label="Transcription">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <rect x="4" y="4" width="16" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" />
                            <path d="M7 8h10M7 12h10M7 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                    <a href="/logs.html" target="_blank" class="nav-icon-btn" title="Логи сервера" aria-label="Логи сервера" style="text-decoration:none;color:inherit;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/>
                            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </a>
                </div>
                <button id="sidebar-toggle" class="sidebar-toggle nav-icon-btn" aria-expanded="true" aria-label="Свернуть историю" title="Свернуть/развернуть историю">
                    <!-- Иконка свернуть (панель влево) для раскрытого состояния -->
                    <svg class="icon-collapse" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M7 4v16" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M14 12h-6l3-3m-3 3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <!-- Иконка развернуть (панель вправо) для свернутого состояния -->
                    <svg class="icon-expand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M17 4v16" fill="none" stroke="currentColor" stroke-width="2" />
                        <path d="M10 12h6l-3-3m3 3l-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
            <div id="search-history">
                <!-- История поиска будет добавлена здесь динамически -->
            </div>
            <div id="transcription-history" style="display:none">
                <!-- Транскрипция будет добавляться сюда построчно -->
            </div>
        </div>
        
        <div class="container">

            <div class="search-container">
                <div class="input-group">
                    <button id="reset-search" class="reset-search-button" title="Сбросить поиск (Ctrl+Я)" aria-label="Сбросить поиск (Ctrl+Я)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                    </button>
                    <input type="text" id="search-input" placeholder="Введите запрос или нажмите на микрофон (Alt+M)...">
                    
                    <button id="mic-button" class="mic-button" title="Активировать микрофон" aria-pressed="false">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
                        </svg>
                    </button>
                    <canvas id="mic-visualizer" class="audio-visualizer" aria-hidden="true"></canvas>
                </div>
                <!-- Убрали индикатор статуса для сокращения места -->
            </div>

            <div class="results-container">
                <!-- Анимация загрузки -->
                <div id="loading-container" class="loading-container" style="display: none;">
                    <div class="loading-dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
                
                <div id="results-list">
                    <!-- Результаты поиска будут добавлены здесь динамически -->
                </div>
            </div>
        </div>
    </div>

    <script src="all-data.js" type="module"></script>
    <script src="ui-manager.js?v=4.44" type="module"></script>
    <script src="script.js" type="module"></script>

    <!-- Bottom Sheet for Filters -->
    <div id="sheet-overlay" class="sheet-overlay"></div>
    <div id="filters-sheet" class="bottom-sheet">
        <div class="sheet-header">
            <h3>Фильтры</h3>
            <button id="close-filters" class="close-sheet-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="sheet-content">
            <div class="filter-group">
                <label>Статус</label>
                <div class="filter-chips">
                    <button class="filter-chip" data-filter="status:new">Новые</button>
                    <button class="filter-chip" data-filter="status:learning">Изучаются</button>
                    <button class="filter-chip" data-filter="status:review">Повторение</button>
                </div>
            </div>
            <div class="filter-group">
                <label>Сложность</label>
                <div class="filter-chips">
                    <button class="filter-chip" data-filter="difficulty:easy">Легко</button>
                    <button class="filter-chip" data-filter="difficulty:medium">Средне</button>
                    <button class="filter-chip" data-filter="difficulty:hard">Сложно</button>
                </div>
            </div>
        </div>
        <div class="sheet-footer">
            <button id="reset-filters" class="btn-reset">Сбросить</button>
            <button id="apply-filters" class="btn-apply">Применить</button>
        </div>
    </div>

    <script type="module">
        import { initUI } from './ui-manager.js?v=4.43';
        window.initUI = initUI;
        
        // Unregister Service Workers to fix cache issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('Service Worker unregistered');
                }
            });
        }

        // Auto-init if DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUI);
        } else {
            // DOM готов, вызываем initUI
            initUI();
        }
    </script>
</body>
</html>
